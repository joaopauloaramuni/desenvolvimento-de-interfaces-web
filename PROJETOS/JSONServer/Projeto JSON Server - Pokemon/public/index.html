<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cartas Pokémon</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container largo">
    <h1>Cartas Pokémon</h1>
    <p class="subtitulo">Busca na API do Pokémon TCG e salva as favoritas no JSON Server</p>

    <!-- Busca na API externa (GET) -->
    <form id="form-busca">
      <input type="text" id="busca" placeholder="Nome (ex.: charizard) ou ID (ex.: swsh4-25)" required>
      <button type="submit">Buscar</button>
    </form>

    <p id="status"></p>

    <!-- Resultados da busca -->
    <div id="resultados" class="grade"></div>

    <!-- Detalhes da carta escolhida (igual ao script Python) -->
    <section id="detalhes" hidden></section>

    <!-- Coleção salva no JSON Server (GET, POST, DELETE) -->
    <h2>Minha coleção</h2>
    <div id="colecao" class="grade"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
