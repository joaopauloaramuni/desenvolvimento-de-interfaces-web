<!doctype html>
<html lang="pt-BR" data-bs-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./favicon-192.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <meta name="theme-color" content="#e0434b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pokédex interativa feita com HTML, CSS, Bootstrap e json-server: pesquisa, filtro por tipo, atributos, treinadores e favoritos."
    />
    <title>Pokédex</title>

    <!-- Aplica o tema antes de a página aparecer, para ela não "piscar" -->
    <script>
      (function () {
        var tema = "light";
        try {
          var salvo = localStorage.getItem("pokedex:theme");
          if (salvo === "light" || salvo === "dark") tema = salvo;
          else if (window.matchMedia("(prefers-color-scheme: dark)").matches) tema = "dark";
        } catch (e) {}
        document.documentElement.dataset.theme = tema;
        document.documentElement.dataset.bsTheme = tema;
        document.documentElement.style.colorScheme = tema;
      })();
    </script>

    <!-- Chakra Petch (interface do aparelho) e Atkinson Hyperlegible (textos) - Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Chakra+Petch:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5.3 (arquivos locais em vendor/: funciona sem CDN) -->
    <link rel="stylesheet" href="./vendor/bootstrap/bootstrap.min.css" />

    <!-- Estilos da Pokédex (depois do Bootstrap, para o visual do aparelho prevalecer) -->
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/app.css" />
    <link rel="stylesheet" href="./css/components/device-shell.css" />
    <link rel="stylesheet" href="./css/components/pokedex-cover.css" />
    <link rel="stylesheet" href="./css/components/screen-tabs.css" />
    <link rel="stylesheet" href="./css/components/search-bar.css" />
    <link rel="stylesheet" href="./css/components/sort-control.css" />
    <link rel="stylesheet" href="./css/components/type-filter.css" />
    <link rel="stylesheet" href="./css/components/pokemon-list.css" />
    <link rel="stylesheet" href="./css/components/pokemon-card.css" />
    <link rel="stylesheet" href="./css/components/pokemon-details.css" />
    <link rel="stylesheet" href="./css/components/classic-pokedex.css" />
    <link rel="stylesheet" href="./css/components/trainer-list.css" />
    <link rel="stylesheet" href="./css/components/trainer-avatar.css" />
    <link rel="stylesheet" href="./css/components/stat-bar.css" />
    <link rel="stylesheet" href="./css/components/type-badge.css" />
    <link rel="stylesheet" href="./css/components/favorite-button.css" />
    <link rel="stylesheet" href="./css/components/status-bar.css" />
    <link rel="stylesheet" href="./css/components/empty-state.css" />
    <link rel="stylesheet" href="./css/components/toast.css" />
  </head>
  <body>
    <!--
      O aparelho é fixo (desenhado só com CSS). O main.js preenche:
      #conteudo (abas, pesquisa, filtros e lista), os detalhes e #status (barra de status).
      data-capa e inert são controlados pelo main.js enquanto a capa (Pokédex fechada) está na frente.
    -->
    <div id="app" class="app-root" data-capa="fechada" inert>
      <div class="desk">
        <div class="device">
          <span class="device__grip device__grip--left" aria-hidden="true"></span>
          <span class="device__grip device__grip--right" aria-hidden="true"></span>

          <header class="device__top">
            <div class="device__sensor" aria-hidden="true"><span class="device__sweep"></span></div>

            <h1 class="device__brand">Pokédex</h1>

            <span class="device__led" title="Carregando favoritos" aria-hidden="true">
              <span class="led" data-status="loading"></span>
            </span>

            <div class="device__controls">
              <button
                type="button"
                class="hw-button hw-button--rubber"
                data-action="theme"
                aria-pressed="false"
                aria-label="Modo noturno"
                title="Modo noturno"
                data-bs-toggle="tooltip"
              >
                <svg class="icon"></svg>
                <span class="hw-button__label">Noturno</span>
              </button>
              <button
                type="button"
                class="hw-button hw-button--rubber"
                data-action="power"
                aria-label="Fechar a Pokédex"
                title="Fechar a Pokédex"
                data-bs-toggle="tooltip"
              >
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3.5v8" /><path d="M7.2 6.6a7 7 0 1 0 9.6 0" /></svg>
                <span class="hw-button__label">Fechar</span>
              </button>
              <button
                type="button"
                class="hw-button hw-button--accent"
                data-action="random"
                aria-label="Sortear um Pokémon"
                title="Sortear um Pokémon"
                data-bs-toggle="tooltip"
              >
                <svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="4" y="4" width="16" height="16" rx="3.5" /><circle cx="8.6" cy="8.6" r="1.1" class="icon__dot" /><circle cx="15.4" cy="8.6" r="1.1" class="icon__dot" /><circle cx="12" cy="12" r="1.1" class="icon__dot" /><circle cx="8.6" cy="15.4" r="1.1" class="icon__dot" /><circle cx="15.4" cy="15.4" r="1.1" class="icon__dot" /></svg>
                <span class="hw-button__label">Sortear</span>
              </button>
            </div>
          </header>

          <div class="device__bezel">
            <div class="device__screen">
              <div class="screen-viewport">
                <div id="conteudo" class="screen-content"></div>
                <!-- Os detalhes do Pokémon entram aqui, por cima da lista -->
              </div>
              <div id="status"></div>
            </div>
          </div>

          <footer class="device__bottom" aria-hidden="true">
            <span class="screw"></span>
            <span class="device__speaker"></span>
            <span class="device__engraving">Kanto 151</span>
            <span class="screw"></span>
          </footer>
        </div>
      </div>
    </div>

    <!-- Avisos do Bootstrap (Toast): favorito adicionado/removido ou erro do json-server -->
    <div id="toasts" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="./vendor/bootstrap/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
