<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos - JSON Server</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Cadastro de Alunos</h1>
    <p class="subtitulo">Exemplo de CRUD com JSON Server</p>

    <!-- Formulário para criar (POST) ou editar (PATCH) -->
    <form id="form-aluno">
      <input type="hidden" id="aluno-id">
      <input type="text" id="nome" placeholder="Nome do aluno" required>
      <input type="text" id="curso" placeholder="Curso" required>
      <button type="submit" id="btn-salvar">Adicionar</button>
      <button type="button" id="btn-cancelar" class="secundario" hidden>Cancelar</button>
    </form>

    <!-- Lista preenchida pelo JavaScript (GET) -->
    <ul id="lista-alunos"></ul>
  </main>

  <script src="script.js"></script>
</body>
</html>
